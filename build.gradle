plugins {
    id 'java'
    id 'application'
    id 'io.qameta.allure' version '2.11.2'
}

group 'com.mts.tests'
version = '1.0-SNAPSHOT'


repositories {
    mavenCentral()

}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.21.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.8.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'

    testImplementation 'org.assertj:assertj-core:3.24.2'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Allure Spock adapter
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.24.0'
    testImplementation 'io.qameta.allure:allure-assertj:2.24.0'
}
test {
    useJUnitPlatform()
    systemProperty 'allure.results.directory', 'build/allure-results'
    systemProperty 'allure.link.issue.pattern', 'https://example.com/issue/{}'
    systemProperty 'allure.link.tms.pattern', 'https://example.com/tms/{}'

    // Включить логирование
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
allure {
    version = '2.24.0'
    autoconfigure = true
    useJUnit5 {
        version = '2.24.0'
    }
}
application {
    mainClass = 'Main'
}
